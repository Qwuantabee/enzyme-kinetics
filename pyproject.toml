[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enzkin"
version = "0.1.0"
description = "Enzyme kinetics and inhibition analysis"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
# RDKit is only needed for the descriptor analysis (scripts/qsar_congeneric.py).
# It is kept out of the base dependencies because it is a large binary wheel
# and every other module here works without it.
qsar = ["rdkit>=2024.3"]
all = ["pytest>=7.0", "rdkit>=2024.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
