name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The datasets this repo reads are committed (28 files under data/, the
      # ChEMBL tables and the published P99 traces), so no download is needed:
      # a clone runs the whole suite. That is why this workflow has no fetch
      # step and no skip switch - if it ever needs one, something has stopped
      # being committed and that is the finding.
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: tests
        run: python -m pytest tests/ -q

      - name: figures regenerate from committed artefacts
        # The point of the figure generator is that every PNG is reproducible
        # from data in the repo. Running it in CI is the only way that stays
        # true; a figure that needs a file nobody committed fails here.
        #
        # Pixel comparison, not `git diff`: matplotlib stamps its own version
        # into a tEXt chunk, so a runner with a different matplotlib produces a
        # byte-different PNG with identical pixels. The first CI run failed on
        # all three repos for exactly that reason (`Bin 142376 -> 142376 bytes`).
        run: |
          python scripts/make_figures.py
          python scripts/check_figures.py --dir figures
